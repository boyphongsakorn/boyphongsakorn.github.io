<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ผลสลากกินแบ่งรัฐบาล 1 ส.ค. 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Mali', 'Caveat', cursive;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .board {
    width: 1200px;
    height: 150px;
    background: #ffffff;
    display: flex;
    align-items: stretch;
    padding: 10px 16px;
    gap: 0;
    color: #000;
  }
  .cell {
    flex: 1;
    background: #ffffff;
    border-right: 2px dashed #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 8px;
    text-align: center;
  }
  .cell:last-child {
    border-right: none;
  }
  .cell.main {
    flex: 1.3;
  }
  .label {
    font-family: 'Mali', cursive;
    font-size: 15px;
    color: #000;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .value {
    font-family: 'Caveat', 'Mali', cursive;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #000;
  }
  .cell.main .value {
    font-size: 42px;
  }
  .pair {
    display: flex;
    gap: 14px;
  }
  .pair .value {
    font-size: 28px;
  }
</style>
</head>
<body>

<div class="board">
  <div class="cell main">
    <div class="label">รางวัลที่ 1</div>
    <div class="value">932479</div>
  </div>

  <div class="cell">
    <div class="label">เลขหน้า 3 ตัว</div>
    <div class="pair">
      <div class="value">413</div>
      <div class="value">672</div>
    </div>
  </div>

  <div class="cell">
    <div class="label">เลขท้าย 3 ตัว</div>
    <div class="pair">
      <div class="value">154</div>
      <div class="value">039</div>
    </div>
  </div>

  <div class="cell">
    <div class="label">เลขท้าย 2 ตัว</div>
    <div class="value">69</div>
  </div>
</div>

</body>
</html>
